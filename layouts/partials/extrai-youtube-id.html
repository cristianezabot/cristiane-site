{{ $url := . }}
{{ $id := $url }}
{{ if in $url "youtu.be/" }}
  {{ $id = index (split $url "youtu.be/") 1 }}
{{ else if in $url "v=" }}
  {{ $id = index (split (index (split $url "v=") 1) "&") 0 }}
{{ else if in $url "embed/" }}
  {{ $id = index (split $url "embed/") 1 }}
{{ end }}
{{ return $id }}
